<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecoa | Crear Cuenta</title>
       <link rel="icon" href="assets/img/logoecoa.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

    <div class="login-card">
        <!-- Flecha para volver al inicio -->
        <a href="inicio.html" class="btn-back">← Volver</a>

        <h1>Crear Cuenta</h1>
        <p class="subtitulo-login">Únete a la comunidad de Ecoa</p>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" placeholder="tu@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Crea una contraseña" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmar contraseña:</label>
                <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required>
            </div>

            <button type="submit" class="btn-entrar">Registrarme</button>
        </form>

        <div class="login-footer">
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>
<!-- Script de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
