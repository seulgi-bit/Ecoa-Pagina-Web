
    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecoa | Iniciar Sesión</title>
     <link rel="icon" href="./assets/img/logoecoa.png" type="image/png">
     <link rel="preconnect" href="https://fonts.googleapis.com">

   <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

<body>
    <main class="login-container">
        <div class="login-card">
            <a href="inicio.html" class="btn-back">← Volver</a>
            <h1>Iniciar Sesión</h1>
            <p>Bienvenido de vuelta a Ecoa</p>

            <!-- Formulario de acceso -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
        <a href="./recuperar.html" class="forgot-pass">¿Olvidaste tu contraseña? </a>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
      <div class="login-footer">
        <p>¿No tienes una cuenta? <a href="registro.html">Registrate</a></p>
      </div>
            <p id="mensajeError" class="error-msg"></p>
        </div>
    </main>
   
    <footer>
  <p >&copy; 2026 Ecoa.Todos los derechos reservados.</p>
</footer>
</div>

 <script src="login.js"></script>
