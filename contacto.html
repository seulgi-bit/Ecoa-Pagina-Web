<section id="contacto" class="section">
  <h2 class="titulo-seccion">Contactame</h2>
  <div class="contacto-container">
    <form id="formulario contacto" class="form-contacto" novalidate>
      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre">
        <span class="mensaje-error" id="error-nombre"></span>
      </div>
      <div class="campo">
       <label for="email">Correo electronico:</label>
       <input type="email" id="email" placeholder="tucorreo@gmail.com">
       <span class="mensaje-error" id="email-error"></span>
      </div>
      <div class="campo">
        <label for="mensaje">Tu mensaje:</label>
        <textarea  id="mensaje" rows="3" placeholder="En que te puedo ayudar?"></textarea>
        <span class="mensaje-error" id="error-mensaje"></span>
      </div>
      <button type="submit" class="btn-enviar">Enviar mensaje</button>
      <div id="mensajeExito" class="mensaje-exito"></div>
    </form>
  </div>
</section>
