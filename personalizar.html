<section id="personalizar" class="customizer">
  <h2> Personaliza tu Ecoa </h2>
  <p>Elige las caracteristicas de tu libreta y se te daria un valor aproximado</p>
<form id="form-personalizar">
  <div class="form-group">
    <label for="tamaño">1. Elige el tamaño:</label>
    <select name="tamaño" id="tamaño">
      <option value="A6">A6-Bolsillo</option>
      <option value="A5"select>A5- Estandar</option>
      <option value="A4">A4 - Grande</option>
    </select>
  </div>
<div class="form-group">
  <label for="hojas">2. Tipo de hojas:</label>
  <select name="hojas" id="hojas">
    <option value="punteadas">punteadas (Bullet Journal)</option>
    <option value="rayadas">Rayadas</option>
    <option value="lisas">Lisas / Blancas</option>
    <option value="cuadriculadas">Cuadriculadas</option>
  </select>
  <div class="form-group">
  <label for="hojas">3. Tipo de encuadernacion:</label>
  <select name="encuadernacion" id="encuadernacion">
    <option value="cosido">Cosido</option>
    <option value="argollado">Argollado</option>
    <option value="grapado"> Grapado</option>
  </select>
</div>
<button type="button" id="btn-cotizar" class="btn-secundary">Calcular precio</button>
</form>
<div id="resultado-cotizacion" class="cotizacion-box">
  <p>Selecciona tus opciones para ver la vista previa y costo estimado.</p>
